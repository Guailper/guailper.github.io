  <script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('.site-nav');
    if (toggle) toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? '关闭导航' : '打开导航');
    });

    (() => {
      const card = document.getElementById('card-toc');
      const article = document.getElementById('article-container');
      if (!card || !article) return;

      const tocContent = card.querySelector('.toc-content');
      const links = Array.from(tocContent.querySelectorAll('.toc-link'));
      const headings = Array.from(article.querySelectorAll('h1,h2,h3,h4,h5,h6'));
      const percentage = card.querySelector('.toc-percentage');
      const mobileButton = document.getElementById('mobile-toc-button');
      let activeIndex = -1;

      const scrollToHeading = heading => {
        const start = window.scrollY;
        const end = heading.getBoundingClientRect().top + start - 72;
        const distance = end - start;
        const startTime = performance.now();
        const duration = 300;
        const ease = value => 1 - Math.pow(1 - value, 3);
        const step = now => {
          const progress = Math.min((now - startTime) / duration, 1);
          window.scrollTo(0, start + distance * ease(progress));
          if (progress < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      };

      links.forEach(link => link.addEventListener('click', event => {
        const id = decodeURIComponent(link.getAttribute('href').slice(1));
        const target = document.getElementById(id);
        if (!target) return;
        event.preventDefault();
        history.replaceState(null, '', '#' + encodeURIComponent(id));
        scrollToHeading(target);
        if (window.innerWidth < 901) {
          card.classList.remove('open');
          mobileButton?.setAttribute('aria-expanded', 'false');
          mobileButton?.setAttribute('aria-label', '打开文章目录');
        }
      }));

      const updateToc = () => {
        const articleTop = article.getBoundingClientRect().top + window.scrollY;
        const articleHeight = article.offsetHeight;
        const progress = Math.max(0, Math.min(100, Math.round((window.scrollY - articleTop + window.innerHeight * .35) / Math.max(articleHeight - window.innerHeight * .35, 1) * 100)));
        if (percentage) percentage.textContent = progress + '%';

        let nextIndex = -1;
        headings.forEach((heading, index) => {
          if (heading.getBoundingClientRect().top <= 88) nextIndex = index;
        });
        if (nextIndex === activeIndex) return;
        activeIndex = nextIndex;
        tocContent.querySelectorAll('.active').forEach(item => item.classList.remove('active'));
        if (nextIndex < 0 || !links[nextIndex]) return;

        const current = links[nextIndex];
        current.classList.add('active');
        let parent = current.parentElement;
        while (parent && parent !== tocContent) {
          if (parent.classList.contains('toc-item')) parent.classList.add('active');
          parent = parent.parentElement;
        }
        const centered = current.offsetTop - (tocContent.clientHeight - current.offsetHeight) / 2;
        tocContent.scrollTo({ top: Math.max(0, centered), behavior: 'smooth' });
      };

      let scheduled = false;
      window.addEventListener('scroll', () => {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => { updateToc(); scheduled = false; });
      }, { passive: true });

      mobileButton?.addEventListener('click', () => {
        const open = card.classList.toggle('open');
        mobileButton.setAttribute('aria-expanded', String(open));
        mobileButton.setAttribute('aria-label', open ? '关闭文章目录' : '打开文章目录');
      });
      document.addEventListener('click', event => {
        if (window.innerWidth >= 901 || !card.classList.contains('open')) return;
        if (!card.contains(event.target) && !mobileButton?.contains(event.target)) {
          card.classList.remove('open');
          mobileButton?.setAttribute('aria-expanded', 'false');
          mobileButton?.setAttribute('aria-label', '打开文章目录');
        }
      });
      updateToc();
    })();
  </script>
